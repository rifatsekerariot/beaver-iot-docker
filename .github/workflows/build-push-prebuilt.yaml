# Build and push pre-built Beaver IoT image (widget + ChirpStack-ready) to GHCR.
# Used by zero-touch default: pull this image, no build on server.
# Widgets: Alarm/Map/Device List via beaver-iot-web components.ts glob fix.
name: Build and push prebuilt image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build-docker/**'
      - 'scripts/**'
      - 'examples/**'
      - '.github/workflows/build-push-prebuilt.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/rifatsekerariot/beaver-iot

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone integrations and build ChirpStack JAR
        run: |
          git clone --depth 1 -b main https://github.com/rifatsekerariot/beaver-iot-integrations.git /tmp/beaver-iot-integrations
          docker run --rm \
            -v /tmp/beaver-iot-integrations:/workspace \
            -w /workspace \
            maven:3.8-eclipse-temurin-17-alpine \
            mvn clean package -DskipTests -pl integrations/chirpstack-integration -am -q
          JAR=$(find /tmp/beaver-iot-integrations/integrations/chirpstack-integration/target -maxdepth 1 -name 'chirpstack-integration-*.jar' ! -name '*original*' 2>/dev/null | head -1)
          if [ -z "$JAR" ] || [ ! -f "$JAR" ]; then
            echo "ERROR: ChirpStack JAR not found"
            exit 1
          fi
          mkdir -p build-docker/integrations
          cp -f "$JAR" build-docker/integrations/
          echo "JAR copied to build-docker/integrations"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env for build
        run: |
          cd build-docker
          cat > .env << 'EOF'
          API_GIT_REPO_URL=https://github.com/Milesight-IoT/beaver-iot.git
          API_GIT_BRANCH=origin/release
          WEB_GIT_REPO_URL=https://github.com/rifatsekerariot/beaver-iot-web.git
          WEB_GIT_BRANCH=origin/main
          DOCKER_REPO=milesight
          PRODUCTION_TAG=latest
          EOF

      - name: Build api, web, monolith
        run: |
          cd build-docker
          docker compose build --no-cache api web monolith
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Tag and push monolith to GHCR
        run: |
          docker tag milesight/beaver-iot:latest ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:latest
