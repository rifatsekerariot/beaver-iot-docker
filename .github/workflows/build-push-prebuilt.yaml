# Build and push pre-built Beaver IoT image (widget + ChirpStack-ready) to GHCR.
# Used by zero-touch default: pull this image, no build on server.
# Web: rifatsekerariot/beaver-iot-web main (components.ts = Alarm/Map/Device List).
# Run workflow_dispatch after beaver-iot-web widget fixes to refresh image.
name: Build and push prebuilt image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build-docker/**
      - scripts/**
      - examples/**
      - .github/workflows/build-push-prebuilt.yaml

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/rifatsekerariot/beaver-iot

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone integrations and build ChirpStack JAR
        run: sh scripts/ci-build-jar.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: "--allow-insecure-entitlement network.host"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env for build
        run: sh scripts/create-build-env.sh

      - name: Clone beaver-iot-web (main, COPY like local)
        env:
          WEB_GIT_REPO_URL: "https://github.com/rifatsekerariot/beaver-iot-web.git"
        run: sh scripts/ci-clone-web.sh

      - name: "Build api, web, monolith (order matters: web before monolith)"
        run: sh scripts/build-prebuilt.sh

      - name: Verify web image (our build, not upstream)
        run: sh scripts/verify-web-image.sh

      - name: Tag and push monolith to GHCR
        run: sh scripts/tag-push-ghcr.sh

