# Build and push pre-built Beaver IoT image (widget + ChirpStack-ready) to GHCR.
# Matches LOCAL build: same layout (beaver-iot-web + beaver-iot-docker), beaver-iot-web-local.dockerfile.
# Used by zero-touch default: pull this image, no build on server.
# Updated: 2025-01-24 - BackendReadyCheck component added (wait for backend API before rendering app)
# Updated: 2025-01-24 - RSSI and SNR from rxInfo now saved as entity values
# Updated: 2025-01-24 - ARIOT loading page added (shows before React app loads if backend not ready)
# Updated: 2025-01-24 - ARIOT branding (logos, titles, manifest) - verify in CI build
# Updated: 2025-01-25 - Build assets verification fix - enforce assets directory check
# Updated: 2025-01-25 - Fixed index.html missing script tag - Vite build now creates assets directory
# Updated: 2025-01-25 - ChirpStack status event telemetry (battery, margin) for widgets
# Updated: 2025-01-25 - Sensor-model entity mapping (SensorDecoders telemetry, filtered save)
# Updated: 2025-01-25 - PDF telemetry report page (/report, jsPDF, no-permission access)
# Updated: 2025-01-25 - Dashboard-based PDF report (device grouping, dashboard name in PDF)
# Updated: 2025-01-25 - TypeScript fixes for PDF report (type guards, string type safety)
# Updated: 2025-01-25 - Fix dashboard selection dropdown in report page (useEffect, onChange handler)
# Updated: 2025-01-25 - Fix dashboard Select component (remove label prop, add inputRef, console.log for debugging)
# Updated: 2025-01-25 - Fix dashboard selection persistence (type conversion, SelectChangeEvent, remove shouldUnregister)
# Updated: 2025-01-25 - Fix dashboard ID undefined in API call (use getValues and watch, add type conversion)
# Updated: 2025-01-25 - Fix authentication error handling in report page (prevent duplicate error messages)
# Updated: 2025-01-26 - Add common.loading translation key, improve dashboard ID validation
# Updated: 2025-01-26 - Final fix for dashboard ID undefined - improve form state handling and onChange validation
# Updated: 2025-01-26 - Add comprehensive debug logs to report page - track form state, API calls, and errors
# Updated: 2025-01-26 - Dashboard selection fix - use setValue to ensure form state updates, add mode onChange

name: Build and push prebuilt image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build-docker/**
      - scripts/**
      - examples/**
      - .github/workflows/build-push-prebuilt.yaml

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/rifatsekerariot/beaver-iot

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restructure workspace (match local layout)
        run: sh scripts/restructure-ci-workspace.sh

      - name: Clone integrations and build ChirpStack JAR
        run: cd beaver-iot-docker && sh scripts/ci-build-jar.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: "--allow-insecure-entitlement network.host"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env for build
        run: sh beaver-iot-docker/scripts/create-build-env.sh

      - name: Clone beaver-iot-web (sibling of beaver-iot-docker, same as local)
        env:
          WEB_GIT_REPO_URL: "https://github.com/rifatsekerariot/beaver-iot-web.git"
          WEB_GIT_BRANCH: "main"
          CI_CLONE_WEB_DEST: "beaver-iot-web"
        run: sh beaver-iot-docker/scripts/ci-clone-web.sh

      - name: Verify web source (our repo, widget fixes present)
        run: sh beaver-iot-docker/scripts/verify-web-source.sh beaver-iot-web

      - name: Build web + api + monolith (local dockerfile, root context)
        run: sh beaver-iot-docker/scripts/build-prebuilt.sh

      - name: Log web image widget chunks (diagnostic)
        run: |
          echo "=== Web image /web/assets/js (first 60) ==="
          docker run --rm --entrypoint sh milesight/beaver-iot-web:latest -c "ls /web/assets/js | head -60"
          echo "=== useAlarmEmphasis / DrawingBoard chunks ==="
          docker run --rm --entrypoint sh milesight/beaver-iot-web:latest -c "ls /web/assets/js | grep -E '^useAlarmEmphasis-|^DrawingBoard-' || true"

      - name: Verify web image
        run: sh beaver-iot-docker/scripts/verify-web-image.sh

      - name: Tag and push monolith to GHCR
        run: sh beaver-iot-docker/scripts/tag-push-ghcr.sh
